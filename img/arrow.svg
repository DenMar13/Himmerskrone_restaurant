  <!-- орнамент 1 -->
  <path d="M30 15 
           C32 11, 36 11, 38 15 
           C36 19, 32 19, 30 15" 
        stroke="rgb(252, 252, 252)" stroke-width="0.8" opacity="0.6"/>

  <!-- орнамент 2 -->
  <path d="M50 15 
           C52 11, 56 11, 58 15 
           C56 19, 52 19, 50 15" 
        stroke="rgb(252, 252, 252)" stroke-width="0.8" opacity="0.5"/>

</svg>